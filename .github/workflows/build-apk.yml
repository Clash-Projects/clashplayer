name: Build ClashPlayer APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package ClashPlayer APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ClashPlayer APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
          
          # Find output apk and copy as direct clashplayer.apk
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" clashplayer.apk
          cp "$APK_FILE" clashplayer-debug.apk

      - name: Upload ClashPlayer APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clashplayer
          path: clashplayer.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: "ClashPlayer Latest Build"
          body: "Direct downloadable APK for ClashPlayer. Download directly without unzipping."
          files: |
            clashplayer.apk
            clashplayer-debug.apk
